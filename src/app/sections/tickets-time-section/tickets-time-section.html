<div class="name-section">
  <span></span>
  <p class="large">Mostre ed Eventi</p>
</div>

@if (ticketableExhibitions$ | async; as exhibitions) {

  @for (exhibition of exhibitions; let i = $index; track exhibition.titles) {

    <app-ticket-item [exhibition]="exhibition"></app-ticket-item>

    @if (i < exhibitions.length - 1) {
      <div class="divider"></div>
    }

  }
}
