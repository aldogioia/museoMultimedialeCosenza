<section>
  <a class="logo" routerLink="/" aria-label="Museo Multimediale Cosenza, home" (click)="closeMenu()">
    <img src="logo_studios.png" alt="Museo Multimediale Cosenza">
  </a>
  <a routerLink="/tickets" class="fill">Acquista Biglietti</a>
  <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isOpen" aria-controls="primary-navigation" aria-label="Apri o chiudi il menu">
    <hugeicons-icon [icon]="isOpen ? Cancel01Icon : Menu04Icon" size="32"></hugeicons-icon>
  </button>
</section>
<nav id="primary-navigation" [class.open]="isOpen">
  <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()" routerLinkActive="active" class="small">Home</a>
  <a routerLink="/mostre" (click)="closeMenu()" routerLinkActive="active" class="small">Mostre</a>
  <a routerLink="/eventi" (click)="closeMenu()" routerLinkActive="active" class="small">Eventi</a>
  <a routerLink="/scuole" (click)="closeMenu()" routerLinkActive="active" class="small">Scuole</a>
  <a routerLink="/spazi" (click)="closeMenu()" routerLinkActive="active" class="small">Spazi</a>
  <a routerLink="/feste-private" (click)="closeMenu()" routerLinkActive="active" class="small">Feste Private</a>
  <a id="tickets" routerLink="/tickets" (click)="closeMenu()" routerLinkActive="active" class="small">Acquista Biglietti</a>
</nav>
